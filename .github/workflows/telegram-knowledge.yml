name: Check Telegram website knowledge
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  review-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect changed website source requiring knowledge review
        run: python3 scripts/telegram_capture.py --check